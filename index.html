#rays{position:absolute;left:-30%;top:-20%;width:160%;height:70%;pointer-events:none;background:conic-gradient(from 160deg at 85% 0%,#fff0 0deg,#fff6c050 8deg,#fff0 16deg,#fff4b038 26deg,#fff0 34deg,#fff6c028 44deg,#fff0 52deg);mix-blend-mode:screen;animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(-4deg) translateX(-3%)}}
#hud{position:absolute;top:1%;left:2%;right:2%;height:6%;display:flex;align-items:center;gap:3%;z-index:20}
.pill{flex:1;height:68%;background:linear-gradient(#fffdf6,#f1e2c4);border-radius:99px;border:2px solid #fff;box-shadow:0 2px 3px #0005,inset 0 -3px 4px #d9b98a66;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#4a2e14;font-size:calc(var(--u)*3.6);position:relative;padding-left:8%}
.pill img{position:absolute;left:-9%;height:130%;filter:drop-shadow(0 2px 2px #0006)}
#lvl{width:14%;height:100%;position:relative;flex:none}
#lvl .st{position:absolute;inset:0;background:radial-gradient(circle at 40% 30%,#ffe9a0,#f0a818 55%,#b86a00);clip-path:polygon(50% 0,61% 33%,98% 35%,68% 56%,79% 92%,50% 71%,21% 92%,32% 56%,2% 35%,39% 33%);filter:drop-shadow(0 2px 2px #0006)}
#lvl b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:8%;color:#fff;font-size:calc(var(--u)*4.2);text-shadow:0 1px 0 #8a4a00,0 0 3px #8a4a00}
#xpwrap{position:absolute;left:2%;right:2%;top:7.4%;height:1.3%;background:#3a200c88;border-radius:9px;overflow:hidden;z-index:20;box-shadow:inset 0 1px 2px #0008,0 0 0 1.5px #fff8}
#xp{height:100%;width:0;background:linear-gradient(#fff3a0,#f2b21c 60%,#d88a00);border-radius:9px;transition:width .4s}
#xptxt{position:absolute;right:3%;top:8.9%;font-size:calc(var(--u)*2.6);color:#fff;font-weight:bold;text-shadow:0 1px 2px #000;z-index:20}
#ttl{position:absolute;left:3%;top:8.7%;font-size:calc(var(--u)*2.8);color:#fff;font-weight:900;text-shadow:0 1px 2px #000;z-index:20;letter-spacing:.5px}
/* chalkboard targets */
#targets{position:absolute;top:13%;left:6%;right:6%;height:16%;display:flex;gap:2.2%;align-items:center;z-index:6;padding:2% 3%;border-radius:12px;background:radial-gradient(#2f6a3ccc,#1c4426e6);box-shadow:0 0 0 4px #b07a3c,0 0 0 7px #7a4a1c,0 8px 14px #0008,inset 0 0 20px #0009}
#targets::after{content:"MAKE THESE!";position:absolute;left:50%;top:-1px;transform:translate(-50%,-55%);background:linear-gradient(#ffe27a,#f0a018);color:#6a3000;font-weight:900;font-size:calc(var(--u)*2.7);padding:.4% 4%;border-radius:99px;border:2px solid #fff;box-shadow:0 2px 0 #a85a00;white-space:nowrap}
.tg{flex:1;aspect-ratio:.82;position:relative;border-radius:22% 22% 26% 26%;background:linear-gradient(160deg,var(--c1),var(--c2));border:3px solid #fff;box-shadow:0 4px 0 var(--c3),0 6px 8px #0007,inset 0 -6px 10px #0004;display:flex;align-items:center;justify-content:center;transition:transform .25s}
.tg::before{content:"";position:absolute;left:10%;top:6%;width:80%;height:34%;border-radius:40% 40% 50% 50%;background:linear-gradient(#ffffffb0,#fff0)}
.tg::after{content:"";position:absolute;inset:-9%;border-radius:30%;box-shadow:0 0 0 2px #ffe680;opacity:0;pointer-events:none}
.tg b{position:relative;color:#fff;font-weight:900;font-size:calc(var(--u)*8);text-shadow:0 2px 0 var(--c3),0 0 4px #0006;line-height:1;white-space:nowrap}
.tg .pin{position:absolute;top:-10%;left:50%;width:22%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd23a 45%,#b87800);box-shadow:0 1px 2px #0008}
.tg.hl{animation:tghl .55s infinite alternate}
@keyframes tghl{to{transform:scale(1.1);filter:drop-shadow(0 0 8px #fff3a0)}}
.tg.win{animation:win .7s}
@keyframes win{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-6deg);filter:brightness(1.5) drop-shadow(0 0 14px #fff6a0)}60%{transform:scale(.9) rotate(4deg)}100%{transform:scale(1)}}
.tg.new b{animation:newn .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes newn{from{transform:scale(0) rotate(-90deg)}}
/* tray */
#tray{position:absolute;top:33.5%;left:4%;right:4%;height:11%;z-index:7;display:flex;align-items:center;justify-content:center;gap:2%;padding:0 3%;border-radius:18px;background:linear-gradient(#fffaf0,#f3e0b8);border:3px solid #fff;box-shadow:0 0 0 3px #d9a440,0 6px 10px #0006,inset 0 -6px 12px #d9b98a77}
#tray.shake{animation:tshk .45s}
@keyframes tshk{15%{transform:translateX(-6%)}35%{transform:translateX(5%)}55%{transform:translateX(-4%)}75%{transform:translateX(2%)}}
#tray.ok{animation:tok .5s}
@keyframes tok{40%{transform:scale(1.06);box-shadow:0 0 0 3px #7ad040,0 0 24px #b8ff80,0 6px 10px #0006}}
.slot{height:76%;aspect-ratio:1;border-radius:18%;border:3px dashed #c8a46a;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--u)*6.5);color:#c8a46a;position:relative;cursor:pointer;background:#fff6}
.slot.op{aspect-ratio:.8}

const R=n=>Math.random()*n|0, pick=a=>a[R(a.length)];

// ---------- audio (iOS unlock on first touch) ----------
let AC;const ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function tone(f,t=.15,type='sine',v=.18,d=0,slide){try{const c=ac();if(c.state!=='running')return;const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+d;o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(slide,n+t);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.012);g.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+t+.02)}catch(e){}}
const sfx={tap:k=>{const f=[523,659,784][k]||600;tone(f,.1,'triangle',.16);tone(f*2,.08,'sine',.05,.02)},
undo:()=>tone(500,.12,'triangle',.1,0,300),bad:()=>{tone(200,.2,'square',.07,0,110);tone(150,.25,'square',.05,.1,90)},
coin:()=>{tone(988,.08,'square',.05);tone(1319,.22,'square',.05,.08)},
win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.13,i*.07)),
whoosh:()=>tone(300,.35,'sawtooth',.03,0,1200),
lvl:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.3,'square',.06,i*.1)),
shuf:()=>{for(let i=0;i<5;i++)tone(400+i*120,.08,'triangle',.07,i*.04)}};
function unlock(){try{const c=ac();if(c.state!=='running')c.resume();if(!unlock.done){unlock.done=1;const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}}catch(e){}}
['touchstart','touchend','pointerdown','click','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{capture:true,passive:true}));

const maxN=()=>Math.min(12,5+st.lvl);
const opW=()=>{const L=st.lvl;return {'+':5,'-':L>=2?3:2,'x':L>=3?Math.min(6,1+L):1}};
function wPick(w){let t=0;for(const k in w)t+=w[k];let r=Math.random()*t;for(const k in w)if((r-=w[k])<0)return k;return '+'}
function randNum(){const M=maxN();return Math.random()<.35?1+R(Math.min(6,M)):1+R(M)}
function randTile(){const ops=board.filter(t=>t&&t.t=='o').length;return ops<5||(ops<7&&Math.random()<.15)?{t:'o',v:wPick(opW())}:{t:'n',v:randNum()}}
// ---------- solver ----------
const ev=(a,o,b)=>OPS[o].f(a,b);
function solutions(T,first){const out=[];const nI=[],oI=[];board.forEach((t,i)=>{if(t&&!t.used)(t.t=='n'?nI:oI).push(i)});
 for(const k of oI)for(const i of nI)for(const j of nI){if(i==j)continue;if(ev(board[i].v,board[k].v,board[j].v)==T){out.push([i,k,j]);if(first)return out}}return out}
function decompose(T){const w=opW(),M=Math.max(maxN(),12),c=[];
 for(let a=1;a<=M;a++)for(let b=1;b<=M;b++)for(const o in OPS)if(ev(a,o,b)==T)c.push([a,o,b,w[o]*(a<=maxN()&&b<=maxN()?3:1)]);
 let t=0;c.forEach(x=>t+=x[3]);let r=Math.random()*t;for(const x of c)if((r-=x[3])<0)return x;return c[0]}
function newTargetValue(){const avoid=new Set(targets.map(t=>t&&t.v));for(let g=0;g<200;g++){const o=wPick(opW()),a=randNum(),b=randNum();const v=ev(a,o,b);if(v>=2&&v<=60&&!avoid.has(v))return v}for(let v=2;;v++)if(!avoid.has(v))return v}
function ensure(changed){// guarantee every target has >=1 solution with current (unused) tiles
 const prot=new Set();targets.forEach(t=>{const s=solutions(t.v,1)[0];if(s)s.forEach(i=>prot.add(i))});
 targets.forEach(t=>{if(solutions(t.v,1).length)return;const [a,o,b]=decompose(t.v);const need=[{t:'n',v:a},{t:'o',v:o},{t:'n',v:b}];const got=[];
  need.forEach(nd=>{let i=board.findIndex((x,j)=>x&&!x.used&&!got.includes(j)&&x.t==nd.t&&x.v==nd.v);
   if(i<0){const free=board.map((x,j)=>j).filter(j=>board[j]&&!board[j].used&&!prot.has(j)&&!got.includes(j)&&board[j].t==nd.t);const free2=board.map((x,j)=>j).filter(j=>board[j]&&!board[j].used&&!prot.has(j)&&!got.includes(j));i=free.length?pick(free):pick(free2);board[i]={t:nd.t,v:nd.v};changed&&changed.add(i)}
   got.push(i)});got.forEach(i=>prot.add(i))})}
// ---------- render ----------
function fit(el,box){const s=el;s.style.fontSize='';let f=parseFloat(getComputedStyle(s).fontSize),n=0;const W=(box||s.parentNode).clientWidth*.84;while(s.scrollWidth>W&&n++<25){f*=.92;s.style.fontSize=f+'px'}}
function drawTile(i,anim){const t=board[i],c=$('board').children[i];c.className='tile'+(t?'':' empty')+(t&&t.t=='o'?' o':'')+(t&&t.used?' used':'')+(anim?' pop':'');
 if(!t){c.innerHTML='';return}if(t.t=='o'){c.style.setProperty('--h',OPS[t.v].h);c.style.setProperty('--oc',OPS[t.v].c);c.innerHTML='<span>'+OPS[t.v].s+'</span>'}else c.innerHTML='<span>'+t.v+'</span>';fit(c.firstChild,c)}
function drawTargets(){targets.forEach((t,i)=>{const el=$('targets').children[i];const b=el.querySelector('b');if(b.textContent!=String(t.v)){b.textContent=t.v}fit(b,el)})}
function initTargets(){for(let i=0;i<5;i++){const el=document.createElement('div');el.className='tg';const C=COLORS[i];el.style.setProperty('--c1',C[0]);el.style.setProperty('--c2',C[1]);el.style.setProperty('--c3',C[2]);el.innerHTML='<div class="pin"></div><b></b>';$('targets').appendChild(el)}}
function drawTray(){const sl=$('tray').querySelectorAll('.slot');sl.forEach((s,k)=>{const e=tray[k];s.classList.toggle('nx',k==tray.length&&!busy);
  if(e!=null){const t=board[e];s.className='slot'+(k==1?' op':'')+' f'+(t.t=='o'?' o':'');if(t.t=='o'){s.style.setProperty('--h',OPS[t.v].h);s.innerHTML='<span style="color:'+OPS[t.v].c+'">'+OPS[t.v].s+'</span>'}else s.innerHTML='<span>'+t.v+'</span>'}
  else{s.className='slot'+(k==1?' op':'')+(k==tray.length&&!busy?' nx':'');s.innerHTML=k==1?'<span style="font-size:70%">±×</span>':'?'}});
 const r=$('res');r.className='';const v=cur();if(v==null){r.textContent=tray.length?'…':'?'}else{r.textContent=v;if(targets.some(t=>t.v==v))r.className='match'}fit(r,r)}
function cur(){if(tray.length<3)return null;const [a,o,b]=tray.map(i=>board[i]);return ev(a.v,o.v,b.v)}
addEventListener('resize',()=>{for(let i=0;i<N;i++)drawTile(i);drawTargets();drawTray()});
// ---------- fx ----------
const G=()=>$('game').getBoundingClientRect();
function center(el){const g=G(),r=el.getBoundingClientRect();return [r.left-g.left+r.width/2,r.top-g.top+r.height/2]}
function floatTxt(el,txt,color){const [x,y]=center(el);const f=document.createElement('div');f.className='float';f.textContent=txt;f.style.color=color||'#fff';f.style.left=x+'px';f.style.top=y-20+'px';$('game').appendChild(f);setTimeout(()=>f.remove(),1100)}
function sparks(x,y,n=10,dist=60){for(let k=0;k<n;k++){const s=document.createElement('img');s.src=IMG.spark;s.className='spark';const a=k/n*Math.PI*2+Math.random()*.4,d=dist*(.6+Math.random()*.7);s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.animationDelay=Math.random()*90+'ms';$('game').appendChild(s);setTimeout(()=>s.remove(),1050)}}
function coinsTo(el,n){const g=G(),[x,y]=center(el),t=document.querySelector('.pill').getBoundingClientRect();
 for(let k=0;k<n;k++){const c=document.createElement('div');c.className='coinfx';c.style.left=x+(Math.random()-.5)*50+'px';c.style.top=y+(Math.random()-.5)*30+'px';$('game').appendChild(c);
  setTimeout(()=>{c.style.left=t.left-g.left+'px';c.style.top=t.top-g.top+'px';c.style.transform='scale(.6)'},60+k*70);setTimeout(()=>{c.remove();sfx.coin()},830+k*70)}}
function shakeEl(el,cls='shake'){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),500)}
function clearHL(){document.querySelectorAll('.hl').forEach(t=>t.classList.remove('hl'))}
function info(t){$('info').innerHTML='<span>'+t+'</span>';const s=$('info').firstChild;let f=parseFloat(getComputedStyle($('info')).fontSize),n=0;while(s.offsetHeight>$('info').clientHeight-4&&n++<15){f*=.92;s.style.fontSize=f+'px'}}
// ---------- core ----------
function tap(i){const t=board[i];if(!t||t.used||busy||!started)return;idle=0;clearHL();const c=$('board').children[i];
 const want=tray.length==1?'o':'n';
 if(t.t!=want){sfx.bad();shakeEl(c);shakeEl($('tray'));combo=0;info(want=='n'?'Start with a <b>number</b> first!':'Now pick a sign: <b>+ − ×</b>');return}
 sfx.tap(tray.length);t.used=1;tray.push(i);drawTile(i);drawTray();
 if(tray.length==1)info('Now pick a sign: <b>+ − ×</b>');else if(tray.length==2)info('Pick the second number!');
 if(tray.length==3)check()}
function undo(k){if(busy||k>=tray.length)return;clearHL();const rem=tray.splice(k);rem.forEach(i=>{board[i].used=0;drawTile(i,1)});sfx.undo();drawTray();info(tray.length==1?'Now pick a sign: <b>+ − ×</b>':tray.length==2?'Pick the second number!':'Tap a number to start!')}
function check(){const v=cur();const ti=targets.findIndex(t=>t.v==v);busy=true;drawTray();
 if(ti<0){setTimeout(()=>{sfx.bad();shakeEl($('tray'));$('res').className='bad';combo=0;info(v<0?'No negatives! Try a bigger number first.':v+' isn’t on the board. Try again!')},250);
  setTimeout(()=>{tray.forEach(i=>{board[i].used=0;drawTile(i,1)});tray=[];busy=false;drawTray()},800);return}
 combo++;$('tray').classList.add('ok');setTimeout(()=>$('tray').classList.remove('ok'),500);
 const el=$('targets').children[ti],g=G(),a=$('tray').getBoundingClientRect(),b=el.getBoundingClientRect();
 const [x,o,y]=tray.map(i=>board[i]);const f=document.createElement('div');f.className='fly';f.textContent=x.v+' '+OPS[o.v].s+' '+y.v+' = '+v;
 Object.assign(f.style,{left:a.left-g.left+a.width*.15+'px',top:a.top-g.top+'px',width:a.width*.7+'px',height:a.height+'px'});$('game').appendChild(f);
 setTimeout(sfx.whoosh,250);
 setTimeout(()=>requestAnimationFrame(()=>Object.assign(f.style,{left:b.left-g.left-b.width*.1+'px',top:b.top-g.top+b.height*.25+'px',width:b.width*1.2+'px',height:b.height*.5+'px',fontSize:'calc(var(--u)*2.6)',opacity:.6})),300);
 setTimeout(()=>{f.remove();solved(ti)},820)}
function solved(ti){const el=$('targets').children[ti];sfx.win();el.classList.remove('win');void el.offsetWidth;el.classList.add('win');
 const [x,y]=center(el);sparks(x,y,14,70);const reward=3+st.lvl+Math.min(combo,5)*1;coinsTo(el,5);floatTxt(el,'+'+reward,'#ffe040');st.co+=reward;st.sv++;
 if(combo>=3&&combo%3==0){st.ge+=1;setTimeout(()=>floatTxt($('ge'),'+1 💎','#c8f0ff'),300)}
 info(combo>2?'🔥 '+combo+' in a row! Amazing!':pick(['Great job! ⭐','Super math! 🎉','You got it! ✨','Brilliant! 🌟']));
 const used=tray.slice();tray=[];
 setTimeout(()=>{targets[ti]={v:newTargetValue()};const ch=new Set(used);used.forEach(i=>board[i]=randTile());ensure(ch);
  el.classList.remove('new');void el.offsetWidth;el.classList.add('new');drawTargets();ch.forEach(i=>drawTile(i,1));busy=false;drawTray();gainXP(1)},600)}
function gainXP(n){st.xp+=n;while(st.xp>=need()){st.xp-=need();st.lvl++;st.ge+=3;sfx.lvl();const l=$('lvup');l.innerHTML='LEVEL '+st.lvl+'!<small>+3 gems · '+(st.lvl>=3?'more × and bigger numbers!':'bigger numbers!')+'</small>';l.style.display='flex';const g=G();for(let k=0;k<5;k++)setTimeout(()=>sparks(g.width*(.2+Math.random()*.6),g.height*(.3+Math.random()*.3),8,60),k*200);setTimeout(()=>l.style.display='none',1600);ensure(new Set());for(let i=0;i<N;i++)drawTile(i)}updHud()}
$('lvup').onpointerdown=()=>$('lvup').style.display='none';
function updHud(){$('lvlt').textContent=st.lvl;$('co').textContent=st.co.toLocaleString();$('ge').textContent=st.ge;$('sv').textContent=st.sv;$('xp').style.width=(100*st.xp/need())+'%';$('xptxt').textContent=st.xp+' / '+need()+' to Level '+(st.lvl+1)}
function hint(free){if(busy)return false;if(tray.length)undo(0);ensure(new Set());const ti=R(5);for(let k=0;k<5;k++){const t=targets[(ti+k)%5];const s=solutions(t.v);if(s.length){const S=pick(s);S.forEach(i=>$('board').children[i].classList.add('hl'));$('targets').children[(ti+k)%5].classList.add('hl');if(!free)info('Try <b>'+board[S[0]].v+' '+OPS[board[S[1]].v].s+' '+board[S[2]].v+'</b> → '+t.v);return true}}for(let i=0;i<N;i++)drawTile(i);return false}
$('hintb').onpointerdown=e=>{e.preventDefault();if(!started)return;if(st.ge<3){info('Need 3 💎 for a hint — 3 in a row earns gems!');sfx.bad();return}if(hint()){st.ge-=3;updHud();tone(880,.2,'sine',.1);tone(1320,.25,'sine',.06,.1)}};
$('shufb').onpointerdown=e=>{e.preventDefault();if(busy||!started)return;clearHL();if(tray.length)undo(0);for(let i=N-1;i>0;i--){const j=R(i+1);[board[i],board[j]]=[board[j],board[i]]}for(let i=0;i<N;i++)drawTile(i,1);sfx.shuf()};
document.querySelectorAll('.slot').forEach(s=>s.onpointerdown=e=>{e.preventDefault();undo(+s.dataset.s)});
$('go').onclick=()=>{unlock();started=true;$('start').remove();sfx.win();info('Tap a number, a sign, then a number!')};
setInterval(()=>{if(!started||busy)return;if(++idle==12)hint(true)},1000);
// ---------- init ----------
initTargets();
for(let i=0;i<N;i++){const c=document.createElement('div');c.onpointerdown=e=>{e.preventDefault();tap(i)};$('board').appendChild(c)}
for(let i=0;i<N;i++)board[i]=randTile();
for(let i=0;i<5;i++)targets[i]={v:newTargetValue()};
ensure(new Set());for(let i=0;i<N;i++)drawTile(i);drawTargets();drawTray();updHud();
window.MB={st,board,targets:()=>targets,tray:()=>tray,solutions,tap,undo,busy:()=>busy};
</script></body></html>
